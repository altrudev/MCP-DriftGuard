name: CI
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Normalize hardening branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.1-hardening' && github.actor != 'github-actions[bot]'
        run: |
          gofmt -w .
          if git diff --quiet -- '*.go'; then
            echo "Go source already formatted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.go'
            git commit -m "gofmt Go sources"
            git push origin HEAD:feature/v0.1-hardening
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: go build ./cmd/mcpdrift

      - name: Build demo fixture
        run: go build ./examples/demo-server
