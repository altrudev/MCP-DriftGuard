name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Evidence gate mutation tests
        run: python3 scripts/test_release_integrity.py

      - name: Historical vulnerability mutation checks
        run: python3 scripts/historical_mutation.py

      - name: Versioned conformance suite
        run: python3 scripts/conformance_suite.py --output "${{ runner.temp }}/mcpdrift-conformance.json"

      - name: Verify revision-bound local evidence
        run: python3 scripts/release_integrity.py --evidence "${{ runner.temp }}/mcpdrift-conformance.json" --commit "${{ github.sha }}"

      - name: Build CLI
        run: go build ./cmd/mcpdrift

      - name: Build demo fixture
        run: go build ./examples/demo-server

      - name: Verify PASS to FAIL demo
        run: |
          set -euo pipefail

          ./demo-server >/tmp/mcpdrift-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          sleep 1

          ./mcpdrift baseline http://127.0.0.1:8787/mcp             --output /tmp/demo.baseline.json

          ./mcpdrift verify http://127.0.0.1:8787/mcp             --baseline /tmp/demo.baseline.json

          kill "$demo_pid"
          wait "$demo_pid" 2>/dev/null || true

          MCPDRIFT_DEMO_DRIFT=1 ./demo-server >/tmp/mcpdrift-demo-drift.log 2>&1 &
          demo_pid=$!
          sleep 1

          set +e
          ./mcpdrift verify http://127.0.0.1:8787/mcp             --baseline /tmp/demo.baseline.json             >/tmp/mcpdrift-drift-result.txt 2>&1
          status=$?
          set -e

          cat /tmp/mcpdrift-drift-result.txt

          test "$status" -eq 2
          grep -q "Verdict: FAIL" /tmp/mcpdrift-drift-result.txt
          grep -q "export_customer_database" /tmp/mcpdrift-drift-result.txt

      - name: Artifact integrity mutation tests
        run: python3 scripts/test_verify_artifacts.py

      - name: Build and verify cross-platform release candidates
        run: |
          python3 scripts/build_artifacts.py "${{ runner.temp }}/mcpdrift-candidates"
          python3 scripts/verify_artifacts.py "${{ runner.temp }}/mcpdrift-candidates"
